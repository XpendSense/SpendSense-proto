syntax = "proto3";

package wellspent.v1;

option go_package = "github.com/BeWellSpent/wellspent-backend/gen/wellspent/v1;wellspentv1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc GetGoogleAuthURL(GetGoogleAuthURLRequest) returns (GetGoogleAuthURLResponse);
  rpc ExchangeGoogleCode(ExchangeGoogleCodeRequest) returns (ExchangeGoogleCodeResponse);
  // Public — no auth required. Native Sign in with Apple: the client already
  // holds a signed identity token from Apple, so there is no server-issued
  // auth URL and no browser redirect to exchange (unlike the Google pair above).
  rpc SignInWithApple(SignInWithAppleRequest) returns (SignInWithAppleResponse);
  // Public — no auth required (driven by a token from the verification email link).
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  // Public — no auth required (used from the login/registration flow before the user has a session).
  rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string country_code = 5; // ISO 3166-1 alpha-2, e.g. "US"
  string state_code = 6; // US only, e.g. "CA" — empty for non-US
  string language = 7; // BCP 47 locale code, e.g. "en", "es" — defaults to "en"
  string currency = 8; // ISO 4217 currency code, e.g. "USD" — defaults to "USD"
  string captcha_token = 9; // Cloudflare Turnstile response token from the widget on the web registration form
}

message RegisterResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  bool remember_me = 3; // true → 90-day JWT; false (default) → 24-hour JWT
}

message LoginResponse {
  string access_token = 1;
  string token_type = 2; // "bearer"
  int64 expires_in = 3; // seconds
  string language = 4; // user's stored locale preference
  string currency = 5; // user's stored currency preference
}

message LogoutRequest {}

message LogoutResponse {}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  int64 expires_in = 2;
}

message GetGoogleAuthURLRequest {
  string state = 1; // CSRF token from client
  string redirect_uri = 2;
}

message GetGoogleAuthURLResponse {
  string url = 1;
}

message ExchangeGoogleCodeRequest {
  string code = 1;
  string state = 2;
  string redirect_uri = 3;
  string language = 4; // locale from localStorage at callback time — used for new users only
  string currency = 5; // currency from localStorage at callback time — used for new users only
}

message ExchangeGoogleCodeResponse {
  string access_token = 1;
  int64 expires_in = 2;
  bool is_new_user = 3;
  string language = 4; // user's stored locale (new user: from request; returning user: from profile)
  string currency = 5; // user's stored currency (new user: from request; returning user: from profile)
}

message SignInWithAppleRequest {
  string identity_token = 1; // Apple id_token (RS256 JWT) from ASAuthorizationAppleIDCredential — verified server-side against Apple's JWKS
  string authorization_code = 2; // one-time code, exchanged server-side for a refresh token so the account can be revoked on deletion
  string first_name = 3; // Apple supplies the name ONLY on the very first authorization, never again — persisted on first link
  string last_name = 4;
  string language = 5; // used for new users only — defaults to "en"
  string currency = 6; // used for new users only — defaults to "USD"
}

message SignInWithAppleResponse {
  string access_token = 1;
  int64 expires_in = 2;
  bool is_new_user = 3;
  string language = 4; // user's stored locale (new user: from request; returning user: from profile)
  string currency = 5; // user's stored currency (new user: from request; returning user: from profile)
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  bool success = 1;
}

message ResendVerificationEmailRequest {
  string email = 1;
}

message ResendVerificationEmailResponse {}
