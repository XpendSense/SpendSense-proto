syntax = "proto3";

package wellspent.v1;

import "google/protobuf/timestamp.proto";
import "wellspent/v1/common.proto";

option go_package = "github.com/BeWellSpent/wellspent-backend/gen/wellspent/v1;wellspentv1";

service UserService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc ChangeEmail(ChangeEmailRequest) returns (ChangeEmailResponse);
  rpc DeleteMe(DeleteMeRequest) returns (DeleteMeResponse);

  // ListCountries was retired on 2026-08-26 and now lives on the REST
  // transport as `GET /rest/v1/countries` — see openapi/v1/wellspent.yaml.
  // Global, identical for every caller, changes roughly never: exactly the
  // shape a browser and a CDN should be allowed to cache, which Connect's
  // unary-POST framing makes impossible.
}

message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  bool is_active = 5;
  bool is_verified = 6;
  google.protobuf.Timestamp created_at = 7;
  string country_code = 8; // ISO 3166-1 alpha-2, e.g. "US"
  string state_code = 9; // US only, e.g. "CA" — empty for non-US users
  FilingStatus filing_status = 10;
  TaxPaymentFrequency tax_payment_frequency = 11;
  string language = 12; // BCP 47 locale code, e.g. "en", "es"
  string currency = 13; // ISO 4217 currency code, e.g. "USD", "ARS", "EUR"
  AccountPlan plan = 14;
  // True when the account's address is an Apple private-relay alias (the user
  // chose "Hide My Email"). Such an address is machine-generated and carries
  // no meaning for the user, so clients show "Signed with Apple" in place of
  // it. Computed server-side so every client agrees rather than each
  // re-deriving the rule.
  bool has_apple_private_email = 15;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message UpdateMeRequest {
  string first_name = 1;
  string last_name = 2;
  string country_code = 3;
  string state_code = 4;
  FilingStatus filing_status = 5;
  TaxPaymentFrequency tax_payment_frequency = 6;
  string language = 7; // BCP 47 locale code, e.g. "en", "es"
  string currency = 8; // ISO 4217 currency code, e.g. "USD", "ARS", "EUR"
}

message UpdateMeResponse {
  User user = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

// Replaces the account's address and resets verification, so the new address
// has to be confirmed before the account is usable again. Exists chiefly as
// the escape hatch for an address mistyped at registration — resending to a
// wrong address can never work.
message ChangeEmailRequest {
  string new_email = 1;
}

message ChangeEmailResponse {
  // The updated user, with is_verified now false.
  User user = 1;
}

message DeleteMeRequest {}

message DeleteMeResponse {}
