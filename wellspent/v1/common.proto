syntax = "proto3";

package wellspent.v1;

option go_package = "github.com/BeWellSpent/wellspent-backend/gen/wellspent/v1;wellspentv1";

// Fixed-point money representation to avoid float precision issues.
// amount = units + nanos / 1_000_000_000
message Money {
  int64 units = 1;
  int32 nanos = 2;
  string currency = 3; // e.g. "USD"
}

enum RecurringType {
  RECURRING_TYPE_UNSPECIFIED = 0;
  RECURRING_TYPE_ONE_OFF = 1;
  RECURRING_TYPE_WEEKLY = 2;
  RECURRING_TYPE_BI_WEEKLY = 3;
  RECURRING_TYPE_MONTHLY = 4;
  RECURRING_TYPE_YEARLY = 5;
}

enum ExpenseType {
  EXPENSE_TYPE_UNSPECIFIED = 0;
  EXPENSE_TYPE_FIXED = 1;
  EXPENSE_TYPE_VARIABLE = 2;
}

enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  PAYMENT_TYPE_CASH = 1;
  PAYMENT_TYPE_CREDIT = 2;
  PAYMENT_TYPE_DEBIT = 3;
  PAYMENT_TYPE_DIGITAL_WALLET = 4;
  PAYMENT_TYPE_BANK_TRANSFER = 5;
  PAYMENT_TYPE_CRYPTO = 6;
  PAYMENT_TYPE_INVESTMENT = 7;
  PAYMENT_TYPE_OTHER = 99;
}

// How often a budget profile cycles into a new period.
enum BudgetCycle {
  BUDGET_CYCLE_UNSPECIFIED = 0;
  BUDGET_CYCLE_WEEKLY = 1;
  BUDGET_CYCLE_BI_WEEKLY = 2;
  BUDGET_CYCLE_MONTHLY = 3;
  BUDGET_CYCLE_YEARLY = 4;
}

// How an income source is earned — determines whether a default amount applies.
enum IncomeType {
  INCOME_TYPE_UNSPECIFIED = 0;
  INCOME_TYPE_SALARY = 1; // fixed monthly/annual — default_amount applies
  INCOME_TYPE_HOURLY = 2; // variable — default_amount = 0, user fills in each period
  INCOME_TYPE_FREELANCE = 3; // variable
  INCOME_TYPE_CONTRACTOR = 4; // project-based
  INCOME_TYPE_INVESTMENT = 5; // dividends, rental, etc.
  INCOME_TYPE_INTEREST = 6; // savings account interest, bonds
  INCOME_TYPE_ONE_TIME = 7; // bonus, tax refund, one-off payment
  INCOME_TYPE_GIFT = 8; // monetary gift
  INCOME_TYPE_OTHER = 99;
}

// US federal/state income tax filing status.
enum FilingStatus {
  FILING_STATUS_UNSPECIFIED = 0;
  FILING_STATUS_SINGLE = 1;
  FILING_STATUS_MARRIED_FILING_JOINTLY = 2;
  FILING_STATUS_MARRIED_FILING_SEPARATELY = 3;
  FILING_STATUS_HEAD_OF_HOUSEHOLD = 4;
  FILING_STATUS_QUALIFYING_SURVIVING_SPOUSE = 5;
}

// Role a user holds on a specific budget profile.
enum BudgetRole {
  BUDGET_ROLE_UNSPECIFIED = 0;
  BUDGET_ROLE_ADMIN = 1; // full access including user management
  BUDGET_ROLE_COLLABORATOR = 2; // all actions except managing users
  BUDGET_ROLE_VIEWER = 3; // read-only; no create/update/delete
}

// How often the user makes estimated tax payments.
// The value encodes the window length in months.
enum TaxPaymentFrequency {
  TAX_PAYMENT_FREQUENCY_UNSPECIFIED = 0;
  TAX_PAYMENT_FREQUENCY_MONTHLY = 1;
  TAX_PAYMENT_FREQUENCY_QUARTERLY = 3;
  TAX_PAYMENT_FREQUENCY_FOUR_MONTHLY = 4;
  TAX_PAYMENT_FREQUENCY_SEMI_ANNUAL = 6;
  TAX_PAYMENT_FREQUENCY_ANNUAL = 12;
}

// Which interval unit a FixedExpense's recurrence is counted in.
// UNSPECIFIED is treated as MONTH for backward compatibility with existing rows.
enum FrequencyUnit {
  FREQUENCY_UNIT_UNSPECIFIED = 0;
  FREQUENCY_UNIT_MONTH = 1; // interval_months + day_of_month apply
  FREQUENCY_UNIT_WEEK = 2; // interval_weeks + day_of_week apply
}

// How a person prefers the expense charts drawn. UNSPECIFIED means the client
// picks — it is the value every existing member carries, so nobody's view
// changes until they choose one.
enum ChartType {
  CHART_TYPE_UNSPECIFIED = 0;
  CHART_TYPE_PIE = 1;
  CHART_TYPE_BAR = 2;
}

// Subscription plan tier for a user account.
enum AccountPlan {
  ACCOUNT_PLAN_UNSPECIFIED = 0;
  ACCOUNT_PLAN_FREE = 1;
  ACCOUNT_PLAN_PRO = 2;
  ACCOUNT_PLAN_LIFETIME = 3;
}

// How loudly a status banner announces itself. Ordered by increasing urgency —
// clients rely on the numeric order to pick a winner when more than one banner
// is live, so new values must keep that ordering meaningful.
enum StatusBannerSeverity {
  STATUS_BANNER_SEVERITY_UNSPECIFIED = 0;
  STATUS_BANNER_SEVERITY_INFO = 1; // green — everything is fine, just letting you know
  STATUS_BANNER_SEVERITY_WARNING = 2; // yellow — degraded, but the app works
  STATUS_BANNER_SEVERITY_CRITICAL = 3; // red — something is badly broken
}

// Which application a changelog release describes. One changelog per shipping
// artifact, so a reader sees what changed in the thing they are actually
// running plus what changed behind it.
//
// Background jobs are deliberately absent: cycle-budgets and plaid-sync ship
// inside the server image and have no separately visible version.
enum ChangelogComponent {
  CHANGELOG_COMPONENT_UNSPECIFIED = 0;
  CHANGELOG_COMPONENT_WEB = 1;
  CHANGELOG_COMPONENT_IOS = 2;
  CHANGELOG_COMPONENT_SERVER = 3;
}

// What a single changelog item did. Keep the set small — three buckets a
// reader can tell apart at a glance beats a taxonomy nobody applies
// consistently.
enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_ADDED = 1; // something new you can do
  CHANGE_TYPE_FIXED = 2; // something that was broken now works
  CHANGE_TYPE_CHANGED = 3; // something behaves differently than it used to
}

// Identifies one of the app's seeded system categories (is_system = TRUE,
// user_id IS NULL). User-created categories always carry UNSPECIFIED.
//
// This exists because both clients special-case certain system categories —
// Income is excluded from every total, Savings gets its own row treatment —
// and until now they did it by comparing Category.name against the literal
// English string. That made the names impossible to localize: the moment
// `name` came back translated, every one of those comparisons would silently
// stop matching, with no error anywhere. Matching on a typed value instead
// makes a mistyped case a compile error and frees `name` to be a display
// string.
//
// Clients render a system category's label from their own string catalog,
// keyed on this enum, and fall back to Category.name (always English) when the
// value is UNSPECIFIED or unknown to that client build. So a category seeded
// after a client shipped still displays sensibly rather than as a raw key.
//
// Numbering follows the order the categories were seeded in, oldest first.
// Adding a system category is deliberately a proto change: both clients
// special-case these, so a silent migration is the wrong amount of friction.
enum SystemCategory {
  SYSTEM_CATEGORY_UNSPECIFIED = 0; // user-created, or unknown to this client

  // Seeded by backend migration 000002.
  SYSTEM_CATEGORY_ENTERTAINMENT = 1;
  SYSTEM_CATEGORY_INSURANCE = 2;
  SYSTEM_CATEGORY_LOAN = 3;
  SYSTEM_CATEGORY_WELLNESS = 4;
  SYSTEM_CATEGORY_SERVICES = 5;
  SYSTEM_CATEGORY_SUBSCRIPTION = 6;
  SYSTEM_CATEGORY_RENT = 7;
  SYSTEM_CATEGORY_TRAVEL = 8;
  SYSTEM_CATEGORY_EATING_OUT = 9;
  SYSTEM_CATEGORY_GROCERIES = 10;
  SYSTEM_CATEGORY_BABY = 11;
  SYSTEM_CATEGORY_PET = 12;
  SYSTEM_CATEGORY_MISC = 13;
  SYSTEM_CATEGORY_HOUSE = 14;

  // 000016
  SYSTEM_CATEGORY_GAS = 15;
  SYSTEM_CATEGORY_AUTO = 16;

  // 000018 — the destination for savings-source transactions.
  SYSTEM_CATEGORY_SAVINGS = 17;

  // 000022
  SYSTEM_CATEGORY_SHOPPING = 18;
  SYSTEM_CATEGORY_FAMILY = 19;

  // 000036 — always excluded from spending totals, regardless of is_excluded.
  SYSTEM_CATEGORY_INCOME = 20;

  // 000037
  SYSTEM_CATEGORY_PAYMENT = 21;
  SYSTEM_CATEGORY_TRANSFER = 22;

  // 000046 — added for Plaid's TRANSPORTATION and RENT_AND_UTILITIES primaries.
  SYSTEM_CATEGORY_TRANSPORTATION = 23;
  SYSTEM_CATEGORY_UTILITIES = 24;

  // 000052 — where a carried-forward shortfall lands.
  SYSTEM_CATEGORY_DEBT = 25;
}
